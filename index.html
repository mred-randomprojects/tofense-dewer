<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c2433" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>Tofense Dewer</title>
    <style>
      :root {
        --bg: #1c2433;
        --panel: rgba(18, 23, 34, 0.92);
        --line: #34405a;
        --text: #eef2ff;
        --dim: #9aa6c4;
        --accent: #ffd84a;
        --good: #8fffa0;
        --bad: #ff5a6a;
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
        border: 1px solid var(--line);
        background: #243049;
        border-radius: 10px;
        padding: 8px 12px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: linear-gradient(#ffe27a, #f2b92e);
        color: #3a2a00;
        border-color: #ffe9a0;
        font-weight: 700;
      }
      [hidden] {
        display: none !important;
      }
      .coin {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff 0 12%, var(--c) 40%, color-mix(in srgb, var(--c) 60%, #000) 100%);
        margin: 0 3px 0 1px;
        vertical-align: -0.05em;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      }
      .unit {
        display: none;
      }
      .wallet {
        font-weight: 700;
        font-size: 18px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      /* ---------- home / workshop overlays ---------- */
      .screen {
        position: fixed;
        inset: 0;
        padding: 12px calc(16px + var(--safe-r)) 16px calc(16px + var(--safe-l));
        background: linear-gradient(rgba(20, 26, 40, 0.86), rgba(20, 26, 40, 0.94));
        overflow-y: auto;
        touch-action: pan-y;
      }
      .homeTop,
      .wsTop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 44px);
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: 0 3px 0 #8a5a00;
      }
      h1 span {
        color: #8fe9ff;
        text-shadow: 0 3px 0 #1f5c7a;
      }
      h2 {
        margin: 0;
      }
      .homeActions {
        display: flex;
        gap: 10px;
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }
      button.big {
        font-size: 18px;
        padding: 12px 20px;
      }
      .hint {
        color: var(--dim);
        font-size: 13px;
        margin: 6px 0 12px;
      }
      .levels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
        gap: 8px;
      }
      .lvl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
      }
      .lvl b {
        font-size: 20px;
      }
      .lvl small {
        font-size: 12px;
        color: var(--dim);
        white-space: nowrap;
      }
      .lvl.cleared {
        border-color: #3d7a4a;
        background: #22392e;
      }
      .lvl.next {
        border-color: var(--accent);
        box-shadow: 0 0 12px rgba(255, 216, 74, 0.35);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .card {
        padding: 12px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 3px solid var(--c, #8a95b5);
      }
      .card h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .card p {
        margin: 0 0 8px;
        color: var(--dim);
        font-size: 13px;
      }
      .card.locked {
        opacity: 0.9;
      }
      .gem {
        display: inline-block;
        width: 10px;
        height: 14px;
        margin-right: 6px;
        background: var(--c);
        clip-path: polygon(50% 0, 100% 45%, 50% 100%, 0 45%);
        vertical-align: -1px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 14px;
      }
      .row > span:first-child {
        width: 88px;
      }
      .pips {
        flex: 1;
        display: flex;
        gap: 2px;
      }
      .pips i {
        flex: 1;
        height: 8px;
        border-radius: 2px;
        background: #2e3850;
      }
      .pips i.on {
        background: var(--c, var(--accent));
      }
      .buy {
        min-width: 86px;
        padding: 6px 8px;
        font-size: 14px;
        white-space: nowrap;
      }
      .buy.unlock {
        width: 100%;
        font-weight: 700;
      }
      .maxed {
        min-width: 86px;
        text-align: center;
        color: var(--good);
        font-weight: 700;
        font-size: 13px;
      }
      /* ---------- battle HUD (lives in the empty corners of the diamond) ---------- */
      .corner {
        position: fixed;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tl {
        top: 10px;
        left: calc(10px + var(--safe-l));
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .tr {
        top: 10px;
        right: calc(10px + var(--safe-r));
      }
      .bl {
        bottom: 10px;
        left: calc(10px + var(--safe-l));
        flex-wrap: wrap;
        max-width: 38vw;
      }
      .br {
        bottom: 10px;
        right: calc(10px + var(--safe-r));
        flex-direction: column;
        align-items: flex-end;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-weight: 700;
      }
      #hudLives {
        color: #ff8a9a;
      }
      .pick {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        background: var(--panel);
      }
      .pick.on {
        border-color: var(--c);
        box-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent);
      }
      .slots {
        color: var(--dim);
        font-weight: 700;
        padding: 0 4px;
      }
      #startBtn {
        font-size: 22px;
        padding: 14px 28px;
      }
      #prepHint {
        position: fixed;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        max-width: 34vw;
        text-align: center;
        font-size: 13px;
        color: var(--dim);
        background: var(--panel);
        padding: 6px 10px;
        border-radius: 8px;
        pointer-events: none;
      }
      /* ---------- result ---------- */
      #result {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(10, 14, 22, 0.6);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 24px;
        text-align: center;
        max-width: 92vw;
      }
      .panel h2 {
        font-size: 30px;
      }
      .win {
        color: var(--good);
      }
      .lose {
        color: var(--bad);
      }
      .reward {
        font-size: 22px;
        font-weight: 700;
      }
      .tag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #5a4a10;
        color: var(--accent);
        vertical-align: middle;
      }
      .dim {
        color: var(--dim);
      }
      .btns {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: var(--bg);
          color: var(--accent);
          font-size: 18px;
        }
        #rotate div {
          font-size: 56px;
        }
      }
      @media (max-height: 460px) {
        button.big {
          font-size: 16px;
          padding: 9px 16px;
        }
        #startBtn {
          font-size: 18px;
          padding: 10px 22px;
        }
        .pick {
          padding: 8px 10px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="home" class="screen scroll"></div>
    <div id="workshop" class="screen scroll" hidden></div>

    <div id="battleHud" hidden>
      <div class="corner tl">
        <span class="chip" id="hudLevel"></span>
        <span class="chip" id="hudLives"></span>
      </div>
      <div class="corner tr">
        <button id="speedBtn" class="chip">1×</button>
        <button id="quitBtn" class="chip" aria-label="Quit level">✕</button>
      </div>
      <div class="corner bl" id="picker"></div>
      <div class="corner br">
        <span class="chip" id="progress" hidden></span>
        <button id="startBtn" class="primary">START ▶</button>
      </div>
      <div id="prepHint"></div>
    </div>

    <div id="result" hidden></div>
    <div id="rotate"><div>⟳</div>Turn your phone sideways</div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
